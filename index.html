  <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solo Female & Safety-First Travel Planner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header style="padding: 20px; text-align: center; background: #f8f9fa;">
        <nav style="margin-bottom: 15px;">
            <a href="index.html" style="margin-right: 15px; font-weight: bold;">Planner</a>
            <a href="blog.html">Safety Blog</a>
        </nav>
        <h1>Solo Female & Safety-First Travel Planner</h1>
        <p>AI-generated, secure itineraries customized for women exploring the world safely.</p>
    </header>

    <main style="max-width: 600px; margin: 30px auto; padding: 20px; background: #ffffff; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
        <form id="travel-form">
            <label for="destination">Destination:</label>
            <input type="text" id="destination" required placeholder="e.g., Tokyo, Kerala, Paris" style="width:100%; padding:8px; margin:8px 0 15px 0;">

            <label for="days">Number of Days:</label>
            <input type="number" id="days" required value="3" min="1" max="14" style="width:100%; padding:8px; margin:8px 0 15px 0;">

            <label for="budget">Budget Level:</label>
            <select id="budget" style="width:100%; padding:8px; margin:8px 0 15px 0;">
                <option value="Low / Budget">Low / Budget</option>
                <option value="Medium / Moderate" selected>Medium / Moderate</option>
                <option value="High / Luxury">High / Luxury</option>
            </select>

            <label for="preferences">Preferences / Interests:</label>
            <input type="text" id="preferences" placeholder="e.g., food, adventure, safe nightlife" style="width:100%; padding:8px; margin:8px 0 15px 0;">

            <button type="submit" style="width:100%; background:#007bff; color:white; padding:12px; border:none; border-radius:5px; font-weight:bold; cursor:pointer;">Generate Safety Itinerary</button>
        </form>

        <div id="result" style="margin-top: 20px; white-space: pre-wrap; font-family: Arial, sans-serif;"></div>
    </main>

    <script>
        document.getElementById('travel-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = "Generating your secure itinerary...";

            const data = {
                destination: document.getElementById('destination').value,
                days: document.getElementById('days').value,
                budget: document.getElementById('budget').value,
                preferences: document.getElementById('preferences').value
            };

            try {
                const response = await fetch('https://ai-travel-planner-94ge.onrender.com/generate-itinerary', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const json = await response.json();
                if(json.itinerary) {
                    resultDiv.innerHTML = json.itinerary;
                } else {
                    resultDiv.innerHTML = "Error: " + (json.error || "Failed to generate.");
                }
            } catch (err) {
                resultDiv.innerHTML = "Error connecting to the server.";
            }
        });
    </script>
</body>
</html>
